# k3s.kituwa.com — static worker-node page, installers, status page.
# Served from the host (kituwa-cloud-1), never from a worker, so it stays up
# when trinity or a volunteer node is offline.

server {
    listen 80;
    listen [::]:80;
    server_name k3s.kituwa.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name k3s.kituwa.com;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/k3s.kituwa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k3s.kituwa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/k3s.kituwa.com;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://plausible.kituwa.com https://analytics.shopdigital.art; style-src 'self'; img-src 'self' data: https://plausible.kituwa.com https://analytics.shopdigital.art; connect-src 'self' https://plausible.kituwa.com https://analytics.shopdigital.art; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # The installers are the product. Serve them as text so `curl | sh` works
    # and so a browser shows the source instead of downloading it.
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /install-macos.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /install.ps1 {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The join-code form posts same-origin; this host proxies it to the central
    # intake on loopback. The page stays static and the intake stays the only
    # writer. No CORS: the browser never talks to another origin.
    location ^~ /api/v1/forms/ {
        limit_except GET POST { deny all; }
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8199;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|svg|png|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    access_log /var/log/nginx/k3s.kituwa.com.access.log;
    error_log  /var/log/nginx/k3s.kituwa.com.error.log;
}
