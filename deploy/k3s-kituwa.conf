# k3s.kituwa.com — static worker-node page, installers, status page.
# Served from the host (kituwa-cloud-1), never from a worker, so it stays up
# when trinity or a volunteer node is offline.

server {
    listen 80;
    listen [::]:80;
    server_name k3s.kituwa.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name k3s.kituwa.com;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/k3s.kituwa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k3s.kituwa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/k3s.kituwa.com;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    # The installers are the product. Serve them as text so `curl | sh` works
    # and so a browser shows the source instead of downloading it.
    location = /install.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /install-macos.sh {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /install.ps1 {
        default_type text/plain;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(css|js|svg|png|webp)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    access_log /var/log/nginx/k3s.kituwa.com.access.log;
    error_log  /var/log/nginx/k3s.kituwa.com.error.log;
}
