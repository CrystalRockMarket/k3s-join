name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error -s bash install.sh install-macos.sh tools/*.sh tests/run-tests.sh
      - name: tests
        run: bash tests/run-tests.sh
      - name: dry run against a fixture code
        run: |
          CODE="k3s1.$(printf '{"v":1,"server":"https://203.0.113.10:6443","token":"K10abcdefghijklmnopqrstuvwxyz0123456789::server:0123456789abcdef","tailscale_key":"tskey-auth-kTESTKEY123-CNTRL","node_name":"ci"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')"
          bash install.sh --code "$CODE" --check-code
      - name: page has no inline script
        run: '! grep -q "<script>" site/index.html'
